name: Deploy site on main

# Single-branch deploy. Builds the client and commits docs/ on main.
# GitHub Pages should use: branch main · folder /docs
# https://yunusbashashaik.github.io/Social_OTT_Qatar/

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build client
        run: npm run build -w client
        env:
          VITE_BASE_PATH: /Social_OTT_Qatar/

      - name: Publish built site to docs/ on main
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a client/dist/. docs/
          cp client/dist/index.html docs/404.html
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No docs changes"
            exit 0
          fi
          git commit -m "Publish GitHub Pages from main"
          git push origin HEAD:main
